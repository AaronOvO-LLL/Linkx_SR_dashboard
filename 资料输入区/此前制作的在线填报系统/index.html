<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5597">
<title>灵石踏勘</title>
<link rel="icon" href="assets/lingshi-logo.png">
<link rel="apple-touch-icon" href="assets/lingshi-logo.png">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f2f4f7; color:#1f2937; font-size:15px; }
button { font-family:inherit; border:none; background:none; cursor:pointer; }
textarea,input { font-family:inherit; font-size:16px; color:#1f2937; }
.hidden { display:none !important; }

/* ===== 顶栏 ===== */
.topbar { position:sticky; top:0; z-index:50; background:#2F5597; color:#fff; padding:10px 14px; padding-top:calc(10px + env(safe-area-inset-top)); display:flex; align-items:center; gap:10px; }
.topbar h1 { font-size:17px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.topbar .tb-btn { color:#fff; font-size:15px; padding:6px 10px; border-radius:8px; background:rgba(255,255,255,.14); flex-shrink:0; }
.progress-wrap { padding:8px 14px 0; background:#2F5597; }
.progress-txt { color:#cfe0ff; font-size:12px; margin-bottom:5px; display:flex; justify-content:space-between; }
.progress-bar { height:5px; background:rgba(255,255,255,.22); border-radius:3px; overflow:hidden; margin-bottom:10px; }
.progress-bar i { display:block; height:100%; width:0; background:#7ee2a8; border-radius:3px; transition:width .3s; }

/* ===== 首页 ===== */
#home { max-width:640px; margin:0 auto; padding:16px 14px 40px; }
.brand { text-align:center; padding:22px 0 14px; }
.brand .logo { width:150px; max-width:72%; height:auto; display:inline-block; object-fit:contain; filter:drop-shadow(0 6px 14px rgba(16,24,40,.12)); }
.brand h2 { font-size:22px; margin-top:12px; color:#1f2937; }
.brand p { color:#6b7280; font-size:13px; margin-top:4px; }
.newproj { display:flex; gap:8px; margin:16px 0 20px; }
.newproj input { flex:1; padding:12px 14px; border:1px solid #d6dae2; border-radius:12px; background:#fff; outline:none; min-width:0; }
.newproj input:focus { border-color:#2F5597; }
.newproj button { background:#2F5597; color:#fff; padding:0 20px; border-radius:12px; font-size:15px; font-weight:600; flex-shrink:0; }
.plist-title { font-size:13px; color:#6b7280; margin-bottom:10px; }
.pcard { background:#fff; border-radius:14px; padding:14px; margin-bottom:12px; box-shadow:0 1px 4px rgba(16,24,40,.06); }
.pcard-top { display:flex; align-items:center; gap:10px; }
.pcard-name { font-size:16px; font-weight:600; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pcard-date { font-size:12px; color:#9ca3af; }
.tag { font-size:11px; color:#2F5597; background:#e8eefb; border-radius:5px; padding:1px 6px; margin-right:4px; }
.tag.gray { color:#6b7280; background:#f1f3f7; }
.pcard-prog { display:flex; align-items:center; gap:8px; margin:10px 0; }
.pcard-bar { flex:1; height:6px; background:#eef1f5; border-radius:3px; overflow:hidden; }
.pcard-bar i { display:block; height:100%; background:#2F5597; border-radius:3px; }
.pcard-pct { font-size:12px; color:#6b7280; text-align:right; }
.pcard-alert { font-size:12px; color:#b45309; background:#fff7ed; border:1px solid #fed7aa; border-radius:8px; padding:7px 9px; margin:-1px 0 10px; }
.pcard-btns { display:flex; gap:8px; }
.pcard-btns button { padding:9px 0; border-radius:10px; font-size:14px; font-weight:500; }
.b-open { background:#2F5597; color:#fff; flex:2; }
.b-exp { background:#e8eefb; color:#2F5597; flex:1; }
.b-copy { background:#f1f3f7; color:#374151; flex:1; }
.b-del { background:#fdeeee; color:#d33; flex:1; }
.empty { text-align:center; color:#9ca3af; padding:30px 0; font-size:14px; }
.backup-row { display:flex; gap:10px; margin-top:22px; }
.backup-row button { flex:1; padding:11px 0; border-radius:11px; font-size:14px; background:#fff; color:#4b5563; border:1px dashed #c6ccd6; }
.backup-tip { font-size:12px; color:#9ca3af; text-align:center; margin-top:8px; line-height:1.5; }

/* ===== 填写页 ===== */
#survey { padding-bottom:112px; max-width:640px; margin:0 auto; }
.sec-tabs { position:sticky; top:calc(50px + env(safe-area-inset-top)); z-index:49; display:flex; background:#fff; border-bottom:1px solid #e5e8ee; box-shadow:0 2px 10px rgba(16,24,40,.05); }
.sec-tabs button { flex:1; min-height:54px; padding:10px 2px 8px; font-size:14px; color:#6b7280; border-bottom:2.5px solid transparent; }
.sec-tabs button.on { color:#2F5597; font-weight:600; border-bottom-color:#2F5597; }
.sec-tabs .cnt { font-size:11px; color:#9ca3af; display:block; margin-top:2px; }
.sec-tabs button.on .cnt { color:#2F5597; }
.tools { display:flex; justify-content:flex-end; padding:10px 12px 0; gap:8px; align-items:center; }
.tools .sec-note { flex:1; font-size:12px; color:#8b93a1; }
.fbtn { font-size:13px; color:#4b5563; background:#fff; border:1px solid #d6dae2; border-radius:16px; padding:6px 14px; }
.fbtn.on { background:#2F5597; color:#fff; border-color:#2F5597; }
.group { margin:12px 12px 0; }
.group-hd { display:flex; align-items:center; gap:8px; padding:9px 12px; background:#e9edf5; border-radius:11px; }
.group-hd b { font-size:14.5px; color:#243b63; flex:1; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.group-hd .gcnt { font-size:12px; color:#5b7bb2; font-weight:500; }
.group-hd .chev { font-size:12px; color:#8b93a1; transition:transform .2s; }
.group.clps .chev { transform:rotate(-90deg); }
.group.clps .group-bd { display:none; }
.group-bd { margin-top:8px; }
.icard { background:#fff; border-radius:13px; padding:13px 13px 11px; margin-bottom:9px; box-shadow:0 1px 3px rgba(16,24,40,.05); }
.icard.done { box-shadow:inset 3px 0 0 #34c184, 0 1px 3px rgba(16,24,40,.05); }
.icard.attn { box-shadow:inset 3px 0 0 #f59e0b, 0 1px 3px rgba(16,24,40,.05); }
.icard.focus { outline:2px solid rgba(47,85,151,.35); box-shadow:0 0 0 5px rgba(47,85,151,.12), 0 4px 16px rgba(16,24,40,.14); }
.iq { display:flex; gap:8px; align-items:flex-start; }
.iq .no { flex-shrink:0; font-size:12px; color:#9ca3af; background:#f1f3f7; border-radius:6px; padding:2px 6px; margin-top:1px; }
.iq .qt { font-size:15px; font-weight:500; line-height:1.45; flex:1; }
.iq .must { color:#b45309; font-size:12px; font-weight:600; flex-shrink:0; margin-top:2px; }
.iq .sug { color:#2F5597; font-size:12px; flex-shrink:0; margin-top:2px; }
.photo-remind { font-size:12px; color:#b45309; background:#fff7ed; border-radius:8px; padding:7px 9px; margin-top:8px; }
.ihint { font-size:12px; color:#8b93a1; line-height:1.5; margin:5px 0 0 0; }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.chip { padding:7px 15px; border-radius:18px; background:#f1f3f7; color:#374151; font-size:14px; border:1px solid transparent; }
.chip.on { background:#2F5597; color:#fff; font-weight:500; }
.itext { width:100%; margin-top:10px; border:1px solid #dde1e8; border-radius:10px; padding:10px 12px; background:#fafbfc; resize:none; outline:none; min-height:42px; line-height:1.45; overflow:hidden; }
.itext:focus { border-color:#2F5597; background:#fff; }
.itext.small { min-height:38px; font-size:14px; }
.irow { display:flex; gap:14px; margin-top:9px; align-items:center; flex-wrap:wrap; }
.tgl { font-size:13px; color:#6b7280; padding:4px 2px; }
.tgl.has { color:#c76a00; font-weight:500; }
.tgl-photo { color:#2F5597; }
.tgl-photo.empty { color:#b45309; font-weight:600; }
.subfield { margin-top:8px; }
.subfield label { font-size:12px; color:#c76a00; font-weight:500; }
.thumbs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.thumb { position:relative; width:62px; height:62px; border-radius:9px; overflow:hidden; background:#eee; }
.thumb img { width:100%; height:100%; object-fit:cover; display:block; }
.thumb .del { position:absolute; top:0; right:0; width:20px; height:20px; background:rgba(0,0,0,.55); color:#fff; font-size:13px; line-height:20px; text-align:center; border-radius:0 0 0 8px; }
.savebar { position:fixed; bottom:0; left:0; right:0; z-index:48; background:rgba(255,255,255,.96); border-top:1px solid #e5e8ee; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); display:flex; gap:8px; max-width:640px; margin:0 auto; box-shadow:0 -6px 18px rgba(16,24,40,.08); }
.savebar button { background:#2F5597; color:#fff; padding:11px 14px; border-radius:11px; font-size:15px; font-weight:600; min-height:44px; white-space:nowrap; }
.savebar .navbtn { background:#edf3ff; color:#2F5597; border:1px solid #ccdaf4; }
.savebar .scanbtn { background:#fff7ed; color:#b45309; border:1px solid #fed7aa; }
.savebar button:disabled { background:#edf0f5; color:#a3acba; border-color:#dde2ea; cursor:default; }
.allfilled { text-align:center; color:#34c184; padding:36px 0; font-size:14px; }

/* 图片查看 */
#viewer { position:fixed; inset:0; z-index:99; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; flex-direction:column; }
#viewer img { max-width:100%; max-height:82vh; }
#viewer .vbtns { display:flex; gap:14px; margin-top:16px; }
#viewer button { color:#fff; background:rgba(255,255,255,.15); padding:10px 26px; border-radius:10px; font-size:15px; }
#viewer .vdel { background:rgba(229,72,77,.85); }

/* toast & dialog */
#toast { position:fixed; left:50%; bottom:110px; transform:translateX(-50%); background:rgba(31,41,55,.92); color:#fff; padding:10px 18px; border-radius:10px; font-size:14px; z-index:100; max-width:86vw; text-align:center; transition:opacity .3s; opacity:0; pointer-events:none; }
#toast.show { opacity:1; }
.mask { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:60; display:flex; align-items:center; justify-content:center; padding:24px; }
.dlg { background:#fff; border-radius:16px; padding:20px; width:100%; max-width:340px; }
.dlg h3 { font-size:16px; margin-bottom:10px; }
.dlg p { font-size:14px; color:#6b7280; line-height:1.6; }
.dlg .dbtns { display:flex; gap:10px; margin-top:18px; }
.dlg .dbtns button { flex:1; padding:11px 0; border-radius:10px; font-size:15px; font-weight:500; }
.d-cancel { background:#f1f3f7; color:#374151; }
.d-ok { background:#e5484d; color:#fff; }
.d-blue { background:#2F5597; color:#fff; }
.photo-sheet { align-items:flex-end; padding:0 12px calc(12px + env(safe-area-inset-bottom)); }
.photo-panel { width:100%; max-width:420px; background:#fff; border-radius:16px 16px 14px 14px; padding:10px; box-shadow:0 16px 40px rgba(16,24,40,.22); }
.photo-panel button { width:100%; min-height:50px; border-radius:12px; font-size:16px; color:#1f2937; background:#f7f9fc; margin-top:8px; }
.photo-panel button:first-child { margin-top:0; background:#2F5597; color:#fff; font-weight:600; }
.photo-panel .cancel { background:#fff; color:#6b7280; border:1px solid #e5e8ee; }

@media (max-width: 560px) {
  body { font-size:14px; }
  .topbar { padding-left:10px; padding-right:10px; gap:8px; }
  .topbar .tb-btn { padding:7px 9px; font-size:14px; }
  .progress-wrap { padding-left:10px; padding-right:10px; }
  #home { padding:14px 10px 34px; }
  #survey { padding-bottom:148px; }
  .sec-tabs { top:calc(48px + env(safe-area-inset-top)); }
  .sec-tabs button { min-height:50px; font-size:13px; }
  .tools { padding:9px 10px 0; }
  .group { margin:10px 10px 0; }
  .group-hd { padding:10px 11px; border-radius:10px; }
  .icard { border-radius:11px; padding:12px 11px 10px; }
  .chips { gap:7px; }
  .chip { min-height:40px; padding:8px 13px; }
  .irow { gap:8px; }
  .tgl { min-height:38px; padding:7px 8px; border-radius:9px; background:#f6f8fb; }
  .thumb { width:72px; height:72px; }
  .savebar { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:9px 10px calc(10px + env(safe-area-inset-bottom)); }
  .savebar button { width:100%; padding:10px 8px; font-size:14px; }
}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="camInput" accept="image/*" capture="environment" multiple class="hidden">
<input type="file" id="albumInput" accept="image/*" multiple class="hidden">
<input type="file" id="restoreInput" accept=".zip" class="hidden">
<div id="toast"></div>

<script>
'use strict';
/* ================= IndexedDB ================= */
var db;
function openDB() {
  return new Promise(function (res, rej) {
    var rq = indexedDB.open('lingshi-takan', 1);
    rq.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('photos')) {
        var ps = d.createObjectStore('photos', { keyPath: 'id' });
        ps.createIndex('byPid', 'pid');
      }
    };
    rq.onsuccess = function () { db = rq.result; res(); };
    rq.onerror = function () { rej(rq.error); };
  });
}
function tx(store, mode) { return db.transaction(store, mode).objectStore(store); }
function idbPut(store, val) { return new Promise(function (res, rej) { var r = tx(store, 'readwrite').put(val); r.onsuccess = function(){res();}; r.onerror = function(){rej(r.error);}; }); }
function idbDel(store, key) { return new Promise(function (res, rej) { var r = tx(store, 'readwrite').delete(key); r.onsuccess = function(){res();}; r.onerror = function(){rej(r.error);}; }); }
function idbAll(store) { return new Promise(function (res, rej) { var r = tx(store, 'readonly').getAll(); r.onsuccess = function(){res(r.result);}; r.onerror = function(){rej(r.error);}; }); }
function idbGet(store, key) { return new Promise(function (res, rej) { var r = tx(store, 'readonly').get(key); r.onsuccess = function(){res(r.result);}; r.onerror = function(){rej(r.error);}; }); }
function photosByPid(pid) {
  return new Promise(function (res, rej) {
    var r = tx('photos', 'readonly').index('byPid').getAll(pid);
    r.onsuccess = function(){res(r.result);}; r.onerror = function(){rej(r.error);};
  });
}

/* ================= 云同步（腾讯云COS，公有读写桶） ================= */
var CLOUD = { base: null, on: false, key: '' };
(function () {
  try {
    var qp = new URLSearchParams(location.search);
    CLOUD.key = qp.get('k') || localStorage.getItem('lsAccessKey') || '';
    if (CLOUD.key) localStorage.setItem('lsAccessKey', CLOUD.key);
    var m = location.hostname.match(/^(.+)\.cos-website\.([^.]+)\.myqcloud\.com$/);
    if (m) CLOUD.base = 'https://' + m[1] + '.cos.' + m[2] + '.myqcloud.com';
    else if (localStorage.getItem('lsCloudBase')) CLOUD.base = localStorage.getItem('lsCloudBase').replace(/\/+$/, '');
    else if (/^https?:$/.test(location.protocol)) CLOUD.base = location.origin;
  } catch (e) {}
  CLOUD.on = !!CLOUD.base;
})();
function cloudUrl(path) {
  var url = CLOUD.base + path;
  if (CLOUD.key && url.indexOf('k=') < 0) url += (url.indexOf('?') >= 0 ? '&' : '?') + 'k=' + encodeURIComponent(CLOUD.key);
  return url;
}
function cFetch(path, opt) {
  opt = opt || {};
  if (!opt.credentials) opt.credentials = 'same-origin';
  return fetch(cloudUrl(path), opt).then(function (r) {
    if (!r.ok && r.status !== 404) throw new Error('HTTP ' + r.status);
    return r;
  });
}
function cloudList(prefix) {
  return cFetch('/?prefix=' + encodeURIComponent(prefix) + '&max-keys=1000').then(function (r) { return r.text(); }).then(function (xml) {
    var doc = new DOMParser().parseFromString(xml, 'text/xml');
    return Array.prototype.map.call(doc.getElementsByTagName('Contents'), function (c) {
      return { key: c.getElementsByTagName('Key')[0].textContent };
    });
  });
}
function cloudGetJson(key) {
  return cFetch('/' + key).then(function (r) { return r.status === 404 ? null : r.json(); });
}
function cloudPut(key, body, type) {
  return cFetch('/' + key, { method: 'PUT', body: body, headers: { 'Content-Type': type || 'application/json' } });
}
function cloudDel(key) { return cFetch('/' + key, { method: 'DELETE' }); }
function cloudPushProject(p) {
  if (!CLOUD.on) return Promise.resolve();
  return cloudPut('data/' + p.id + '.json', JSON.stringify(p));
}
function photoCloudKey(ph) { return 'photos/' + ph.pid + '/' + ph.key + '__' + ph.ts + '.jpg'; }
function cloudPushPhoto(ph) {
  if (!CLOUD.on || !ph.blob || ph.up) return Promise.resolve();
  return cloudPut(photoCloudKey(ph), ph.blob, 'image/jpeg').then(function () {
    ph.up = 1;
    return idbPut('photos', { id: ph.id, pid: ph.pid, key: ph.key, ts: ph.ts, blob: ph.blob, up: 1 });
  });
}
function parseCloudPhotoKey(k) {
  var m = k.match(/^photos\/[^/]+\/(.+)__(\d+)\.jpg$/);
  return m ? { cloudKey: k, key: m[1], ts: +m[2], url: cloudUrl('/' + k), up: 1 } : null;
}
function gatherProject(pid) { // 本地+云端合并取新，照片合并去重
  var pr = [idbGet('projects', pid), photosByPid(pid)];
  if (CLOUD.on) pr.push(cloudGetJson('data/' + pid + '.json').catch(function () { return null; }), cloudList('photos/' + pid + '/').catch(function () { return []; }));
  return Promise.all(pr).then(function (rs) {
    var local = rs[0], localPh = rs[1] || [], cloud = rs[2] || null, cloudPh = rs[3] || [];
    var p = local && cloud ? (cloud.updated > local.updated ? cloud : local) : (local || cloud);
    var localKeys = {}, phs = [];
    localPh.forEach(function (ph) { localKeys[photoCloudKey(ph)] = 1; phs.push(ph); });
    cloudPh.forEach(function (o) {
      if (localKeys[o.key]) return;
      var rec = parseCloudPhotoKey(o.key);
      if (rec) phs.push(rec);
    });
    phs.sort(function (a, b) { return a.ts - b.ts; });
    return { p: p, phs: phs };
  });
}

/* ================= 状态 ================= *//* ================= 状态 ================= */
var cur = null;
var curPhotos = {};
var curTab = 0;
var saveTimer = null;
var onlyUnfilled = false;
var clpsState = {};   // 分组折叠状态 'S4|cat' -> true
var KEY2GRP = {};     // itemKey -> group DOM 序号
var pendingFocus = null;
var app = document.getElementById('app');
var CORE_SECS = SECTIONS.filter(function (s) { return !s.ext; });
var TOTAL_CORE = CORE_SECS.reduce(function (a, s) { return a + s.items.length; }, 0);
var TOTAL_EXT = SECTIONS.filter(function (s) { return s.ext; }).reduce(function (a, s) { return a + s.items.length; }, 0);

function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function itemFilled(it, a, photoMap) {
  var hasPhoto = photoMap ? !!photoMap[it.key] : (curPhotos[it.key] || []).length > 0;
  if (it.ty === 'p') return hasPhoto;
  if (!a) return false;
  return !!((a.v && a.v.trim()) || (a.t && a.t.trim()));
}
function itemNeedsAttention(it, a, photoMap) {
  var hasPhoto = photoMap ? !!photoMap[it.key] : (curPhotos[it.key] || []).length > 0;
  return !itemFilled(it, a, photoMap) || (it.photo === 1 && !hasPhoto);
}
function attentionItems(p, photoMap) {
  var out = [];
  SECTIONS.forEach(function (sec, si) {
    sec.items.forEach(function (it) {
      var a = p.answers[it.key];
      var empty = !itemFilled(it, a, photoMap || {});
      var missPhoto = it.photo === 1 && !(photoMap && photoMap[it.key]);
      if (empty || missPhoto) out.push({ key: it.key, item: it, secIndex: si, empty: empty, missPhoto: missPhoto });
    });
  });
  return out;
}
function attentionSummary(p, photoMap) {
  var missCore = 0, missPhoto = 0;
  SECTIONS.forEach(function (sec) {
    sec.items.forEach(function (it) {
      if (!sec.ext && !itemFilled(it, p.answers[it.key], photoMap || {})) missCore++;
      if (it.photo === 1 && !(photoMap && photoMap[it.key])) missPhoto++;
    });
  });
  return { missCore: missCore, missPhoto: missPhoto };
}
function projProgress(p, photoMap) {
  var core = 0, ext = 0;
  SECTIONS.forEach(function (sec) {
    sec.items.forEach(function (it) {
      if (itemFilled(it, p.answers[it.key], photoMap || {})) { sec.ext ? ext++ : core++; }
    });
  });
  return { core: core, ext: ext };
}
function curPhotoMap() {
  var m = {};
  Object.keys(curPhotos).forEach(function (k) { if (curPhotos[k].length) m[k] = 1; });
  return m;
}

/* ================= 首页 ================= */
function renderHome() {
  cur = null; curPhotos = {};
  Promise.all([idbAll('projects'), idbAll('photos')]).then(function (rs) {
    var localProjs = rs[0], allPh = rs[1];
    var photoMapByPid = {};
    allPh.forEach(function (ph) { (photoMapByPid[ph.pid] = photoMapByPid[ph.pid] || {})[ph.key] = 1; });
    if (!CLOUD.on) { drawHome(localProjs, photoMapByPid, null); return; }
    cloudList('data/').then(function (objs) {
      return Promise.all(objs.map(function (o) { return cloudGetJson(o.key).catch(function () { return null; }); }));
    }).then(function (cloudProjs) {
      var map = {};
      localProjs.forEach(function (p) { map[p.id] = { p: p, loc: 1 }; });
      cloudProjs.filter(Boolean).forEach(function (cp) {
        if (map[cp.id]) { map[cp.id].cld = 1; if (cp.updated > map[cp.id].p.updated) map[cp.id].p = cp; }
        else map[cp.id] = { p: cp, cld: 1 };
      });
      var merged = Object.keys(map).map(function (k) { return map[k].p; });
      drawHome(merged, photoMapByPid, map);
    }).catch(function () {
      drawHome(localProjs, photoMapByPid, null);
      toast('云端连接失败，当前为本机模式');
    });
  });
}
function drawHome(projs, photoMapByPid, statusMap) {
  projs = projs.slice().sort(function (a, b) { return b.updated - a.updated; });
  var h = '<div id="home"><div class="brand"><img class="logo" src="assets/lingshi-logo.png" alt="灵石"><h2>灵石踏勘</h2><p>现场收资 · ' + (CLOUD.on ? '云端共享' : '离线可用') + ' · 一键导出Excel</p></div>';
  h += '<div class="newproj"><input id="npName" placeholder="输入项目名称，如：重庆陆海国际" maxlength="40"><button onclick="newProj()">新建踏勘</button></div>';
  if (projs.length) {
    h += '<div class="plist-title">踏勘项目（' + projs.length + '）</div>';
    projs.forEach(function (p) {
      var pg = projProgress(p, photoMapByPid[p.id]);
      var att = attentionSummary(p, photoMapByPid[p.id] || {});
      var pct = Math.round(pg.core / TOTAL_CORE * 100);
      var d = new Date(p.updated);
      var ds = (d.getMonth() + 1) + '/' + d.getDate() + ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
      var st = statusMap && statusMap[p.id];
      var tag = !CLOUD.on ? '' : (st && st.cld ? '<span class="tag">云端</span>' : '<span class="tag gray">仅本机</span>');
      var pctTxt = '核心 ' + pg.core + '/' + TOTAL_CORE + (pg.ext ? ' · 专项 ' + pg.ext : '');
      var alertTxt = [];
      if (att.missCore) alertTxt.push('待补 ' + att.missCore + ' 项');
      if (att.missPhoto) alertTxt.push('待拍 ' + att.missPhoto + ' 张');
      h += '<div class="pcard"><div class="pcard-top"><div class="pcard-name">' + esc(p.name) + '</div>' + tag + '<div class="pcard-date">' + ds + '</div></div>' +
        '<div class="pcard-prog"><div class="pcard-bar"><i style="width:' + pct + '%"></i></div><div class="pcard-pct">' + pctTxt + '</div></div>' +
        (alertTxt.length ? '<div class="pcard-alert">' + alertTxt.join(' · ') + '</div>' : '') +
        '<div class="pcard-btns"><button class="b-open" onclick="openProj(\'' + p.id + '\')">继续填写</button>' +
        '<button class="b-exp" onclick="exportProj(\'' + p.id + '\')">导出</button>' +
        '<button class="b-copy" onclick="copyProj(\'' + p.id + '\')">复制</button>' +
        '<button class="b-del" onclick="askDel(\'' + p.id + '\',\'' + esc(p.name).replace(/'/g, '') + '\')">删除</button></div></div>';
    });
  } else {
    h += '<div class="empty">还没有踏勘项目，先新建一个吧</div>';
  }
  h += '<div class="backup-row"><button onclick="backupAll()">⬇ 备份全部数据</button><button onclick="document.getElementById(\'restoreInput\').click()">⬆ 恢复备份</button></div>';
  h += '<div class="backup-tip">' + (CLOUD.on ? '数据实时同步到云端，团队成员打开同一网址即可看到全部项目。' : '数据保存在本机浏览器中。换手机或清理浏览器前，请先备份（含照片），在新设备上恢复即可继续。') + '</div>';
  h += '</div>';

}
function newProj() {
  var inp = document.getElementById('npName');
  var name = inp.value.trim();
  if (!name) { toast('请先输入项目名称'); inp.focus(); return; }
  var p = { id: 'p' + Date.now(), name: name, created: Date.now(), updated: Date.now(), answers: {} };
  idbPut('projects', p).then(function () { cloudPushProject(p).catch(function () {}); openProj(p.id); });
}
function copyProj(pid) {
  idbGet('projects', pid).then(function (p) {
    if (!p) return;
    var name = prompt('新项目名称（复制「' + p.name + '」的已填内容，照片不复制）', p.name + '-2');
    if (!name || !name.trim()) return;
    var np = { id: 'p' + Date.now(), name: name.trim(), created: Date.now(), updated: Date.now(), answers: JSON.parse(JSON.stringify(p.answers)) };
    idbPut('projects', np).then(function () { return cloudPushProject(np).catch(function () {}); }).then(function () { toast('已复制'); renderHome(); });
  });
}
function askDel(pid, name) {
  var m = document.createElement('div');
  m.className = 'mask';
  m.innerHTML = '<div class="dlg"><h3>删除踏勘项目</h3><p>确定删除「' + esc(name) + '」吗？项目数据和照片将一并删除，无法恢复。</p>' +
    '<div class="dbtns"><button class="d-cancel">取消</button><button class="d-ok">删除</button></div></div>';
  document.body.appendChild(m);
  m.querySelector('.d-cancel').onclick = function () { m.remove(); };
  m.onclick = function (e) { if (e.target === m) m.remove(); };
  m.querySelector('.d-ok').onclick = function () {
    photosByPid(pid).then(function (phs) {
      return Promise.all(phs.map(function (ph) { return idbDel('photos', ph.id); }));
    }).then(function () { return idbDel('projects', pid); })
      .then(function () {
        if (!CLOUD.on) return;
        return cloudList('photos/' + pid + '/').then(function (objs) {
          return Promise.all(objs.map(function (o) { return cloudDel(o.key).catch(function () {}); }));
        }).then(function () { return cloudDel('data/' + pid + '.json'); }).catch(function () {});
      })
      .then(function () { m.remove(); toast('已删除'); renderHome(); });

}

/* ================= 备份 / 恢复 ================= */
function backupAll() {
  toast('正在打包备份…');
  Promise.all([idbAll('projects'), idbAll('photos')]).then(function (rs) {
    var projs = rs[0], phs = rs[1];
    if (!projs.length) { toast('没有可备份的项目'); return; }
    var zip = new JSZip();
    var meta = { v: 2, exported: Date.now(), projects: projs, photos: [] };
    var folder = zip.folder('photos');
    phs.forEach(function (ph, i) {
      var fn = 'ph' + i + '.jpg';
      meta.photos.push({ id: ph.id, pid: ph.pid, key: ph.key, ts: ph.ts, file: fn });
      folder.file(fn, ph.blob);
    });
    zip.file('backup.json', JSON.stringify(meta));
    zip.generateAsync({ type: 'blob', compression: 'STORE' }).then(function (b) {
      var d = new Date(), ds = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
      dl(b, '灵石踏勘备份-' + ds + '.zip');
      toast('备份完成：' + projs.length + ' 个项目、' + phs.length + ' 张照片');
    });
  }).catch(function (e) { toast('备份失败：' + e.message); });
}
document.getElementById('restoreInput').addEventListener('change', function () {
  var f = this.files && this.files[0];
  this.value = '';
  if (!f) return;
  toast('正在恢复…');
  JSZip.loadAsync(f).then(function (zip) {
    var jf = zip.file('backup.json');
    if (!jf) throw new Error('不是灵石踏勘备份文件');
    return jf.async('string').then(function (s) {
      var meta = JSON.parse(s);
      var chain = Promise.resolve();
      meta.projects.forEach(function (p) { chain = chain.then(function () { return idbPut('projects', p); }); });
      meta.photos.forEach(function (pm) {
        chain = chain.then(function () {
          var pf = zip.file('photos/' + pm.file);
          if (!pf) return;
          return pf.async('blob').then(function (blob) {
            return idbPut('photos', { id: pm.id, pid: pm.pid, key: pm.key, ts: pm.ts, blob: blob });
          });
        });
      });
      return chain.then(function () { return meta; });
    });
  }).then(function (meta) {
    toast('已恢复 ' + meta.projects.length + ' 个项目');
    renderHome();
  }).catch(function (e) { toast('恢复失败：' + e.message); });
});

/* ================= 填写页 ================= */
function openProj(pid) {
  gatherProject(pid).then(function (g) {
    cur = g.p;
    if (!cur) { renderHome(); return; }
    idbPut('projects', cur);
    curPhotos = {};
    g.phs.forEach(function (ph) { (curPhotos[ph.key] = curPhotos[ph.key] || []).push(ph); });
    ALL_ITEMS.forEach(function (it) {
      if (it.auto === 'date' && !(cur.answers[it.key] && cur.answers[it.key].v)) {
        cur.answers[it.key] = cur.answers[it.key] || {};
        cur.answers[it.key].v = todayStr();
      }
    });
    curTab = 0; onlyUnfilled = false; clpsState = {};
    renderSurvey();
    if (pendingFocus && pendingFocus.pid === pid) {
      var pf = pendingFocus;
      pendingFocus = null;
      setTimeout(function () { focusItem(pf.key, pf.msg); }, 80);
    }
  });
}
function renderSurvey() {

function compress(file) {
  return new Promise(function (res, rej) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      var MAX = 1600;
      var w = img.width, hgt = img.height;
      if (w > MAX || hgt > MAX) { var k = MAX / Math.max(w, hgt); w = Math.round(w * k); hgt = Math.round(hgt * k); }
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = hgt;
      cv.getContext('2d').drawImage(img, 0, 0, w, hgt);
      URL.revokeObjectURL(url);
      cv.toBlob(function (b) { b ? res(b) : rej(new Error('压缩失败')); }, 'image/jpeg', 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); rej(new Error('图片读取失败')); };
    img.src = url;
  });

}
function doExport(p, phs) {
  toast('正在生成导出文件…');
  phs = phs.slice().sort(function (a, b) { return a.ts - b.ts; });
  var photosMeta = {}, imageMap = {}, files = [], cnt = {};
  phs.forEach(function (ph) {
    var it = ALL_ITEMS.find(function (x) { return x.key === ph.key; });
    if (!it) return;
    var sec = SECTIONS.find(function (x) { return x.key === it.sec; });
    cnt[ph.key] = (cnt[ph.key] || 0) + 1;
    var label = (it.item || it.q || '').replace(/[\\/:*?"<>|\s]/g, '').slice(0, 12) || '照片';
    var name = sec.cn + '-' + ('0' + it.n).slice(-2) + '-' + label + '-' + cnt[ph.key] + '.jpg';
    var media = 'image' + (files.length + 1) + '.jpg';
    (photosMeta[ph.key] = photosMeta[ph.key] || []).push(name);
    (imageMap[ph.key] = imageMap[ph.key] || []).push({ media: media, title: name });
    files.push({ name: name, media: media, ph: ph });
  });
  var parts = buildXlsxParts(p.name, p.answers, photosMeta, imageMap);
  var xz = new JSZip();
  Object.keys(parts).forEach(function (path) { xz.file(path, parts[path]); });
  var blobsPr = Promise.all(files.map(function (f) { return photoBlobForExport(f.ph); }));
  blobsPr.then(function (blobs) {
    files.forEach(function (f, i) { xz.file('xl/media/' + f.media, blobs[i]); });
    return xz.generateAsync({ type: 'blob', compression: 'DEFLATE', mimeType: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
      .then(function (xlsxBlob) { return { xlsxBlob: xlsxBlob, blobs: blobs }; });
  }).then(function (rs) {
    var xlsxBlob = rs.xlsxBlob, blobs = rs.blobs;
    var d = new Date(), ds = d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2);
    var base = '灵石踏勘-' + p.name + '-' + ds;
    if (!files.length) {
      dl(xlsxBlob, base + '.xlsx');
      toast('已导出Excel（无照片）');
      return;
    }
    var zip = new JSZip();
    zip.file(base + '.xlsx', xlsxBlob);
    var folder = zip.folder('照片');
    files.forEach(function (f, i) { folder.file(f.name, blobs[i]); });
    return zip.generateAsync({ type: 'blob', compression: 'STORE' }).then(function (zb) {
      dl(zb, base + '.zip');
      toast('已导出：Excel内含照片，另附原图 ' + files.length + ' 张');
    });
  }).catch(function (e) { toast('导出失败：' + e.message); });
}
function dl(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}

openDB().then(renderHome).catch(function (e) {
  app.innerHTML = '<div style="padding:40px 20px;text-align:center;color:#6b7280">本机浏览器不支持离线存储（' + esc(e && e.message) + '）。<br>请使用 Chrome / Edge / Safari 浏览器打开本文件。</div>';
});
window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', function () { if (document.hidden) flushSave(); });
