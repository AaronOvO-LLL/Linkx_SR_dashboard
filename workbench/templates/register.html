{% extends 'base.html' %}
{% block title %}注册 · {{ app_cfg.app_name }}{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <h2>注册个人账号</h2>
    <p class="sub">填写姓名、电话和分部即可完成注册，手机号将作为登录账号。</p>
    <div class="flash">初始密码为 <strong>{{ default_password }}</strong>，进入系统后可在“修改密码”中自行修改。</div>
    {% if error %}<div class="flash warn">{{ error }}</div>{% endif %}
    <form method="post" id="registerForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="fld"><span>姓名</span><input type="text" name="display_name" required maxlength="80" autocomplete="name" value="{{ request.form.get('display_name', '') }}"></label>
      <label class="fld"><span>电话（手机号）</span><input type="tel" name="phone" required pattern="1[3-9][0-9]{9}" maxlength="11" inputmode="numeric" autocomplete="tel" placeholder="请输入 11 位手机号" value="{{ request.form.get('phone', '') }}"></label>
      <label class="fld"><span id="registerDeptLabel">分部</span><select name="dept_key" aria-labelledby="registerDeptLabel" required>
        <option value="">请选择分部</option>
        {% for d in depts %}<option value="{{ d.key }}" {% if request.form.get('dept_key') == d.key %}selected{% endif %}>{{ d.name }}</option>{% endfor %}
      </select></label>
      <button class="btn" type="submit" style="width:100%;justify-content:center">完成注册</button>
    </form>
    <a class="btn ghost" href="{{ url_for('login') }}" style="width:100%;justify-content:center;margin-top:12px">返回登录</a>
  </div>
</div>
{% endblock %}
