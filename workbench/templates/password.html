{% extends 'base.html' %}
{% block title %}修改分部密码{% endblock %}
{% block content %}
{% set step = step_of(0) %}
<div style="max-width:460px">
  <div class="card">
    <h2>修改「{{ dept.name }}」访问密码</h2>
    <p class="sub">口令以哈希形式保存在运行数据目录的 departments.json 中，无法从中还原明文；忘记口令只能由运维重置。</p>
    {% if error %}<div class="flash warn">{{ error }}</div>{% endif %}
    <form method="post">
      <label class="fld"><span>原密码</span><input type="password" name="old_password" required></label>
      <label class="fld"><span>新密码（至少 6 位）</span><input type="password" name="new_password" required></label>
      <label class="fld"><span>确认新密码</span><input type="password" name="confirm_password" required></label>
      <div class="btn-row">
        <button class="btn" type="submit">保存新密码</button>
        <a class="btn gray" href="{{ url_for('projects') }}">返回</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
