# 阶段二：备案完成、域名 hao-rizon.com 解析到本机后启用 —— 域名 + HTTPS。
# 前置：已用 Certbot 申请到证书（见部署文档），证书路径按实际调整。
# 启用后可关闭阶段一的 8770 监听，并在腾讯云防火墙放行 80/443。

# HTTP 全部强制跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hao-rizon.com www.hao-rizon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hao-rizon.com www.hao-rizon.com;

    # Let's Encrypt 证书路径（certbot --nginx 通常会自动填好）
    ssl_certificate     /etc/letsencrypt/live/hao-rizon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hao-rizon.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 关键：告诉后端真实协议是 https，Flask 才会给 Cookie 打 Secure 标记
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;
    }
}
