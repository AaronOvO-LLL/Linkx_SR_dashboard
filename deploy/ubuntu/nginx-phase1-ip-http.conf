# 阶段一：备案完成前 —— 用「服务器公网 IP + HTTP + 非标准端口 8770」对外。
# 大陆腾讯云会拦截未备案域名的 80/443 访问，故本阶段刻意避开这两个端口。
# 安装：复制到 /etc/nginx/sites-available/lingshi 并软链到 sites-enabled，nginx -t 后 reload。

server {
    listen 8770;
    listen [::]:8770;
    server_name _;            # 用 IP 访问，匹配任意 Host

    # 录音文件较大（数十 MB），放宽上传体积上限
    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 录音转写 / 大模型提取耗时较长，放宽读超时
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;
    }
}
