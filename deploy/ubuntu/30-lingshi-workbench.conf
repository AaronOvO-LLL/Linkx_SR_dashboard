# Install as /etc/rsyslog.d/30-lingshi-workbench.conf (Ubuntu 22.04).
# The filename uses the local date when rsyslog receives each message.
template(name="LingshiDailyFile" type="string"
    string="/var/log/lingshi-workbench/%timegenerated:::date-year%-%timegenerated:::date-month%-%timegenerated:::date-day%.log")

if ($programname == "lingshi-workbench") then {
    action(type="omfile"
        dynaFile="LingshiDailyFile"
        template="RSYSLOG_FileFormat"
        fileOwner="syslog"
        fileGroup="adm"
        fileCreateMode="0640"
        dirOwner="syslog"
        dirGroup="adm"
        dirCreateMode="0750"
        createDirs="on")
    # Already retained in journal; avoid another copy in /var/log/syslog.
    stop
}
